[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohe-tools"
version = "0.1.0"
description = "Command-line tools for operating OpenHands Enterprise (OHE)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "All Hands AI" }]
keywords = ["openhands", "enterprise", "cli", "sandbox", "runtime-api"]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
ohe = "ohe.cli:main"

[project.urls]
Homepage = "https://github.com/OpenHands/ohe-tools"
Documentation = "https://docs.openhands.dev/enterprise"

[tool.hatch.build.targets.wheel]
packages = ["src/ohe"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
